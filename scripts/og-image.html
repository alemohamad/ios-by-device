<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<!--
  Template for docs/images/iOS-by-Device.png (1200×630 social preview).
  Render it with `npm run og`. The dot positions and fade were measured from the
  original image; dot and mark styles match .color in the site stylesheet, scaled ×1.22.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  /* Dots fade out toward the bottom */
  .dots {
    position: absolute;
    inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0px, rgba(0,0,0,0.943) 45px, rgba(0,0,0,0.869) 90px, rgba(0,0,0,0.805) 135px, rgba(0,0,0,0.723) 180px, rgba(0,0,0,0.617) 225px, rgba(0,0,0,0.539) 270px, rgba(0,0,0,0.442) 315px, rgba(0,0,0,0.355) 360px, rgba(0,0,0,0.265) 405px, rgba(0,0,0,0.182) 450px, rgba(0,0,0,0.114) 495px, rgba(0,0,0,0.065) 540px, rgba(0,0,0,0.025) 585px, rgba(0,0,0,0) 630px);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0px, rgba(0,0,0,0.943) 45px, rgba(0,0,0,0.869) 90px, rgba(0,0,0,0.805) 135px, rgba(0,0,0,0.723) 180px, rgba(0,0,0,0.617) 225px, rgba(0,0,0,0.539) 270px, rgba(0,0,0,0.442) 315px, rgba(0,0,0,0.355) 360px, rgba(0,0,0,0.265) 405px, rgba(0,0,0,0.182) 450px, rgba(0,0,0,0.114) 495px, rgba(0,0,0,0.065) 540px, rgba(0,0,0,0.025) 585px, rgba(0,0,0,0) 630px);
  }
  .dot {
    position: absolute;
    width: 39px;
    height: 39px;
    margin: -19.5px 0 0 -19.5px;
    border-radius: 50%;
    background-color: #f5f5f7;
    box-shadow: 0 0 1.2px 1.2px #0000001a;
  }
  .dot.green { background-color: #64b94d; box-shadow: none; }
  .dot.red { background-color: #dd3c43; box-shadow: none; }
  .dot.green::after,
  .dot.red::after {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    background-color: #fff;
    -webkit-mask: var(--mark) center / 19.5px no-repeat;
    mask: var(--mark) center / 19.5px no-repeat;
  }
  .dot.green { --mark: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8.5l3.2 3.2L13 4.8' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"); }
  .dot.red { --mark: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 4.5l7 7M11.5 4.5l-7 7' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round'/></svg>"); }

  /* Title block, with a soft white glow so the gray dots behind it don't compete */
  .title-block {
    position: absolute;
    left: 800px;
    top: 150px;
    width: 360px;
  }
  .title-block::before {
    content: "";
    position: absolute;
    inset: -60px -50px;
    z-index: -1;
    background: radial-gradient(closest-side, #fff 72%, #fff0);
  }
  .title {
    color: #000;
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .subtitle {
    margin-top: 14px;
    color: #3a3a3c;
    font-size: 25px;
    line-height: 1.3;
  }
</style>
</head>
